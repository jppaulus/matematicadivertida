# Configurações do projeto (este arquivo vai para o repositório).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36
android.overridePathCheck=true
kotlin.code.style=official

# O projeto exige JDK 21 — veja compileOptions e jvmToolchain em app/build.gradle.kts.
#
# NÃO coloque org.gradle.java.home aqui. Como este arquivo é versionado, um caminho de
# uma máquina específica quebra o build de todas as outras. Era o caso até agora: havia
# um "C:/Program Files/Android/Android Studio1/jbr" fixo, que derrubava qualquer build
# fora daquele computador — inclusive o do GitHub Actions, com a mensagem
# "Java home supplied is invalid".
#
# Onde configurar o JDK, em ordem de preferência:
#
#   1. Android Studio — File > Settings > Build, Execution, Deployment > Build Tools >
#      Gradle > Gradle JDK. Use o JBR que vem junto com o Studio; já é 21.
#   2. Linha de comando — variável de ambiente JAVA_HOME.
#   3. Se você precisar mesmo de um caminho fixo, ponha em ~/.gradle/gradle.properties,
#      dentro da sua pasta de usuário. Fica só na sua máquina e não vai para o git.
