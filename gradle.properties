# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
# JDK 21 do Gradle NESTA máquina de desenvolvimento (caminho específico do Windows).
# Em outra máquina, defina org.gradle.java.home em %USERPROFILE%\.gradle\gradle.properties,
# que tem precedência sobre este arquivo. É assim que o CI (.github/workflows) sobrescreve.
org.gradle.java.home=C:/Program Files/Android/Android Studio1/jbr
android.overridePathCheck=true

