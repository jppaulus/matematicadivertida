name: CI

# Roda em push de QUALQUER branch. É de propósito: o trabalho acontece em branches
# de feature, e o CI só serve para alguma coisa se rodar lá, não apenas na main.
#
# Não há gatilho de pull_request porque ele seria redundante — o GitHub mostra na aba
# Checks do PR as execuções do commit, e o push da branch de origem já cobre isso.
# Com os dois gatilhos, cada commit rodaria duas vezes.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Push novo na mesma branch cancela a execução anterior, que já está desatualizada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Compilar e checar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle com cache
        uses: gradle/actions/setup-gradle@v4

      # compileSdk = 36 em app/build.gradle.kts. O AGP não baixa a plataforma sozinho:
      # se ela não estiver instalada, o build para com "Failed to find target with hash
      # string 'android-36'". Por isso ela é instalada explicitamente aqui.
      - name: SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Preparar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash .github/scripts/preparar-google-services.sh

      - name: Permissão de execução no gradlew
        run: chmod +x gradlew

      # Só tarefas de debug. A variante de release precisa do keystore, que fica
      # fora do repositório — pedir "build" ou "assemble" aqui falharia na assinatura,
      # sem nada a ver com o código.
      - name: Compilar o app
        run: ./gradlew assembleDebug

      # Este passo é o que pega erro de compilação nos testes instrumentados sem
      # precisar de emulador. Era exatamente o que estava quebrado antes.
      - name: Compilar os testes instrumentados
        run: ./gradlew assembleDebugAndroidTest

      - name: Testes unitários (JVM)
        run: ./gradlew testDebugUnitTest

      # Não derruba o build: o lint aponta coisas antigas do projeto que não têm
      # relação com a mudança sendo enviada. O relatório fica nos artefatos.
      # Quando a lista estiver limpa, tire o continue-on-error para virar obrigatório.
      - name: Lint
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-build
          path: app/build/reports/
          if-no-files-found: ignore

  emulador:
    name: Testes de UI no emulador
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle com cache
        uses: gradle/actions/setup-gradle@v4

      - name: SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Preparar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash .github/scripts/preparar-google-services.sh

      # Sem isto o emulador roda por software e fica lento a ponto de estourar o tempo.
      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Permissão de execução no gradlew
        run: chmod +x gradlew

      # API 34: imagem google_apis x86_64 estável e, por ser 33+, exercita o caminho
      # da permissão POST_NOTIFICATIONS do lembrete diário.
      - name: Rodar os testes no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew connectedDebugAndroidTest

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-emulador
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
